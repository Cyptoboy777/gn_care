# Flipkart deals refresh, price-drop alerts, and the daily top-deals post.
# Requires repository secrets FLIPKART_AFFILIATE_TOKEN and TELEGRAM_BOT_TOKEN.
# Set ENABLE_FLIPKART_DEALS=true to run. Telegram posting exits cleanly if the
# bot token is missing.
name: Flipkart deals sync

on:
  schedule:
    - cron: '30 */2 * * *'  # every 2 hours at :30 UTC = 06:00, 08:00, 10:00 ... IST
  workflow_dispatch:

jobs:
  sync:
    if: ${{ vars.ENABLE_FLIPKART_DEALS == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync Flipkart deals
        env:
          FLIPKART_AFFILIATE_TOKEN: ${{ secrets.FLIPKART_AFFILIATE_TOKEN }}
        run: node scripts/sync-deals.mjs
      - name: Test
        run: node tests/run.js
      - name: Post price drops and daily deals to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          POST_DAILY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/post-telegram-store-deals.mjs
      - name: Commit if changed
        run: |
          git config user.name "gn-care-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/deals.json scripts/telegram-deals-posted.json scripts/price-history.json
          if git diff --cached --quiet; then echo "No deals changes"; exit 0; fi
          git commit -m "Flipkart deals sync $(date -u +%F)"
          git pull --rebase origin main
          git push
